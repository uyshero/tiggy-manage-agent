apiVersion: v1
kind: ServiceAccount
metadata:
  name: tma-model-runtime
  namespace: tma
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tma-model-runtime
  namespace: tma
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tma-model-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tma-model-runtime
    spec:
      serviceAccountName: tma-model-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-runtime
          image: registry.example.com/tma-model-runtime:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TMA_MODEL_RUNTIME_HTTP_ADDR
              value: :8090
            - name: TMA_MODEL_RUNTIME_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tma-runtime-secrets
                  key: TMA_MODEL_RUNTIME_AUTH_TOKEN
          ports:
            - name: http
              containerPort: 8090
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tma-model-runtime
  namespace: tma
spec:
  selector:
    app.kubernetes.io/name: tma-model-runtime
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tma-model-runtime-ingress
  namespace: tma
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tma-model-runtime
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tma-server
      ports:
        - protocol: TCP
          port: 8090
